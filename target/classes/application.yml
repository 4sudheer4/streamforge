spring:
  application:
    name: streamforge
  datasource:
    url: jdbc:postgresql://localhost:5432/streamforge
    username: streamforge
    password: streamforge
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
streamforge:
  dedup:
    ttl-minutes: 30
