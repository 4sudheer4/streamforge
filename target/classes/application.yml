spring:
  application:
    name: streamforge
  datasource:
    url: jdbc:postgresql://localhost:5432/streamforge
    username: streamforge
    password: streamforge
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
streamforge:
  dedup:
    ttl-minutes: 30